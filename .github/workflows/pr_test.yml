name: PR Test

# 배포 없이 Pull Request에서 전체 테스트(Testcontainers MySQL 통합 테스트 포함)만 실행한다.
# 시크릿(APPLICATION_YML 등)을 사용하지 않는다. 테스트는 src/test/resources의 더미 설정으로 동작한다.

on:
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # REQUIRE_DOCKER=true: Docker를 쓸 수 없으면 통합 테스트를 SKIP하지 않고 실패시킨다.
      - name: Test with Gradle
        env:
          REQUIRE_DOCKER: "true"
        run: ./gradlew test --stacktrace

      - name: Verify integration tests actually ran
        run: bash scripts/verify-tests.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7
