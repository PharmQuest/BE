plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pharmquest'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// B-005: Docker 29(최소 API 1.44)와 호환되도록 Testcontainers만 1.21.4로 올린다.
// Spring Boot 3.3.7 BOM 기본값은 1.19.8이며, 이 버전은 Docker 29에서 연결이 거부된다.
// 2.x는 artifact/패키지 이름이 바뀌어(org.testcontainers:mysql -> testcontainers-mysql 등) Boot 3.3.x와 맞지 않는다.
ext['testcontainers.version'] = '1.21.4'

repositories {
	mavenCentral()
	maven { url "https://maven.google.com" }  // Google Maven Repository
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// B-005: 테스트 전용 MySQL 컨테이너 (버전은 Spring Boot BOM이 관리)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Spring Boot WebFlux (WebClient 사용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Spring Boot DevTools (개발 시 편의성 제공)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

	// Netty (macOS에서 DNS 서버 주소를 처리)
	runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.104.Final:osx-aarch_64'

	// Security (소셜 로그인 관련 의존성)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	testImplementation 'org.springframework.security:spring-security-test'

	// Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.2'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.2'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.2'

	// OAuth 2.0
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'com.google.cloud:google-cloud-translate:2.55.0'

	implementation 'org.springframework.boot:spring-boot-starter-mustache'
	implementation 'io.awspring.cloud:spring-cloud-starter-aws:2.3.1'

    // prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
	useJUnitPlatform()
}

// QueryDSL 관련 설정 (필요 시 유지)
def querydslDir = "src/main/generated"

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

clean.doLast {
	file(querydslDir).deleteDir()
}
