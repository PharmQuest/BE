name: CI/CD Pipeline

on:
  push:
    branches: [ main ]  # main 브랜치에 push 발생 시 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3  # 코드 체크아웃

      - name: Set up JDK 17  # Java 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Delete Gradle Cache  # Gradle 캐시 삭제
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper

      - name: Grant execute permission for gradlew  # Gradle 실행 권한 부여
        run: chmod +x gradlew

      # 테스트는 APPLICATION_YML을 만들기 전에 실행한다. 테스트 클래스패스에 운영 설정이 아예 없게 하기 위함이다.
      # REQUIRE_DOCKER=true: Docker를 쓸 수 없으면 통합 테스트를 SKIP하지 않고 실패시킨다.
      - name: Test with Gradle  # 테스트 (실패 시 이후 단계와 deploy job이 실행되지 않는다)
        uses: gradle/gradle-build-action@v2
        env:
          REQUIRE_DOCKER: "true"
        with:
          arguments: test --stacktrace
          cache-disabled: true

      - name: Verify integration tests actually ran  # 통합 테스트 클래스가 실행됐고 SKIPPED가 없는지 확인
        shell: bash
        run: |
          for cls in PharmquestApplicationTests TestConfigIsolationTests; do
            report="build/test-results/test/TEST-com.pharmquest.pharmquest.${cls}.xml"
            if [ ! -f "$report" ]; then echo "통합 테스트 결과가 없다: $report"; exit 1; fi
            if ! grep -qE '<testsuite [^>]*tests="[1-9][0-9]*"' "$report"; then echo "$cls: 실행된 테스트가 0개다"; exit 1; fi
            if ! grep -qE '<testsuite [^>]*skipped="0"' "$report"; then echo "$cls: SKIPPED된 테스트가 있다"; exit 1; fi
          done
          if grep -lE '<testsuite [^>]*skipped="[1-9]' build/test-results/test/*.xml; then echo "SKIPPED된 테스트가 있다"; exit 1; fi
          echo "통합 테스트 클래스가 모두 실행됐고 SKIPPED가 없다"

      - name: Ensure resources directory exists
        run: mkdir -p ./src/main/resources

      - name: Make application.yml  # application.yml 설정 (배포용 jar에 포함, 테스트 이후에 생성)
        run: |
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml
        shell: bash

      - name: Build with Gradle  # 테스트는 위에서 이미 실행했으므로 jar만 만든다
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test --stacktrace
          cache-disabled: true  #  Gradle 캐시 비활성화

      - name: Upload build artifact  # 빌드된 JAR 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: umc7thServer
          path: build/libs/*.jar

  deploy:
    needs: build  # build 완료 후 실행
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact  # JAR 다운로드
        uses: actions/download-artifact@v4
        with:
          name: umc7thServer
          path: build/libs/

      - name: Deploy to EC2  # EC2 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_NAME: "umc7thServer"  # 애플리케이션 이름
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)

          echo " Deploying JAR to EC2..."
          
          # EC2 접속 및 기존 애플리케이션 종료
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << EOF
            echo " Stopping existing application..."
            PID=\$(pgrep -f $APP_NAME.jar)
            if [ -n "\$PID" ]; then
              echo "Found running process: \$PID, stopping..."
              kill -15 \$PID
              sleep 5
            else
              echo "No running process found."
            fi
          EOF

          # JAR 업로드
          echo " Uploading new JAR..."
          scp -i private_key.pem -o StrictHostKeyChecking=no "$jar_file" $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/$APP_NAME.jar

          # 새 애플리케이션 실행
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST << EOF
            echo " Starting new application..."
            nohup java -jar /home/$EC2_USERNAME/$APP_NAME.jar > /home/$EC2_USERNAME/app.log 2>&1 &
            echo " Deployment completed!"
          EOF

          # 보안 키 삭제
          rm -f private_key.pem
