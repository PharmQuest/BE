# 테스트 전용 설정 (B-005). 실제 키·운영/개발 DB 정보를 넣지 않는다.
#
# - 테스트 클래스패스에서 src/main/resources/application.yml(CI가 시크릿으로 생성하거나 개발자 PC에 있는 파일)보다
#   먼저 발견되므로 그 파일을 대체한다 (같은 이름의 클래스패스 리소스는 첫 번째만 로드됨).
# - spring.datasource.url은 일부러 정의하지 않는다. DB 주소는 Testcontainers(@ServiceConnection)만 제공한다.
#   컨테이너가 없으면 데이터소스를 만들 수 없어 실패하므로 원격 DB로 우회 연결될 수 없다.
# - 외부 주소는 모두 예약 도메인(.invalid)이다.

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 컨테이너 안의 임시 스키마. 운영 DDL과 같다는 보장은 없다.
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          test:
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost.invalid/login/oauth2/code/test"
            scope: profile
        provider:
          test:
            authorization-uri: "http://localhost.invalid/oauth/authorize"
            token-uri: "http://localhost.invalid/oauth/token"
            user-info-uri: "http://localhost.invalid/oauth/userinfo"
            user-name-attribute: id

jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLXVuaXQtdGVzdHMtMDAwMDAwMDA=
  redirect: "http://localhost.invalid/redirect"
  access-token:
    expiration-time: 1000
  refresh-token:
    expiration-time: 1000

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket

google:
  cloud:
    translate:
      api-key: test-api-key

fda:
  api:
    api-key: test-api-key

openapi:
  medicine:
    base-url: "http://localhost.invalid"
    api-key: test-api-key

naver:
  api:
    url: "http://localhost.invalid"
  client:
    id: test-client-id
    secret: test-client-secret

place:
  details:
    api-key: test-api-key
